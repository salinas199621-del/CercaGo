name: Deploy CercaGo web

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "apps/admin/**"
      - ".github/workflows/deploy-cercago-web.yml"
      - "package-lock.json"
      - "package.json"
      - "render.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.3"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set site base paths
        shell: bash
        run: |
          if [[ "$GITHUB_REPOSITORY" == "$GITHUB_REPOSITORY_OWNER.github.io" ]]; then
            echo "VITE_BASE_PATH=/" >> "$GITHUB_ENV"
            echo "VITE_ADMIN_BASE_PATH=/admin/" >> "$GITHUB_ENV"
          else
            echo "VITE_BASE_PATH=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"
            echo "VITE_ADMIN_BASE_PATH=/${GITHUB_REPOSITORY#*/}/admin/" >> "$GITHUB_ENV"
          fi

      - name: Build mobile web app
        working-directory: apps/mobile
        env:
          VITE_API_URL: ${{ vars.CERCAGO_API_URL || 'https://cercago.onrender.com/api' }}
        run: npm run build:web

      - name: Build administration panel
        env:
          VITE_API_URL: ${{ vars.CERCAGO_API_URL || 'https://cercago.onrender.com/api' }}
          VITE_BASE_PATH: ${{ env.VITE_ADMIN_BASE_PATH }}
        run: |
          npm run build -w @cercago/admin
          mkdir -p apps/mobile/dist/admin
          cp -R apps/admin/dist/. apps/mobile/dist/admin/

      - name: Add Android download page
        run: |
          mkdir -p apps/mobile/dist/download
          cp apps/mobile/download.html apps/mobile/dist/download/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/mobile/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
