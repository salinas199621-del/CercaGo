name: Redirect legacy GitHub Pages to CercaGo on Render

on:
  push:
    branches: [main]
    paths:
      - "apps/website/legacy-redirect.html"
      - ".github/workflows/deploy-cercago-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Publish redirects to the canonical Render site
        run: |
          mkdir -p dist/admin dist/download
          cp apps/website/legacy-redirect.html dist/index.html
          cp apps/website/legacy-redirect.html dist/admin/index.html
          cp apps/website/legacy-redirect.html dist/download/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
