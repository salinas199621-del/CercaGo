name: Publish CercaGo Android APK

on:
  push:
    tags:
      - "apk-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android build components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.3"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build native Android APK
        working-directory: apps/mobile
        env:
          CERCAGO_API_URL: https://cercago.onrender.com/api
        run: npx react-native build-android --mode=release

      - name: Validate APK
        run: |
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk CercaGo.apk
          test "$(dd if=CercaGo.apk bs=1 count=2 2>/dev/null)" = "PK"
          test "$(stat --format=%s CercaGo.apk)" -gt 1000000

      - name: Publish APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release create "$GITHUB_REF_NAME" CercaGo.apk \
            --title "CercaGo para Android ${GITHUB_REF_NAME#apk-v}" \
            --notes "Descarga e instala CercaGo en Android. Versión ${GITHUB_REF_NAME#apk-v}." \
            2>release-error.log; then
            error_message="$(tr '\r\n' '  ' < release-error.log)"
            error_message="${error_message//%/%25}"
            error_message="${error_message//"$GH_TOKEN"/[REDACTED]}"
            echo "::error title=No se pudo publicar el Release::$error_message"
            exit 1
          fi
