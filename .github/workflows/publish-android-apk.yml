name: Publish CercaGo Android APK

on:
  push:
    tags:
      - "apk-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download APK from EAS
        env:
          APK_URL: https://expo.dev/artifacts/eas/D-da9fFhtZEmTFIK3mTztkzzxUmfdtSfs-e2SWbDtB4.apk
        run: |
          curl --fail --location --retry 3 "$APK_URL" --output CercaGo.apk
          test "$(dd if=CercaGo.apk bs=1 count=2 2>/dev/null)" = "PK"
          test "$(stat --format=%s CercaGo.apk)" -gt 1000000

      - name: Publish APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release create "$GITHUB_REF_NAME" CercaGo.apk \
            --title "CercaGo para Android ${GITHUB_REF_NAME#apk-v}" \
            --notes "Descarga e instala CercaGo en Android. Versión ${GITHUB_REF_NAME#apk-v}." \
            2>release-error.log; then
            error_message="$(tr '\r\n' '  ' < release-error.log)"
            error_message="${error_message//%/%25}"
            error_message="${error_message//"$GH_TOKEN"/[REDACTED]}"
            echo "::error title=No se pudo publicar el Release::$error_message"
            exit 1
          fi
