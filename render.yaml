services:
  - type: web
    name: cercago-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build:api
    startCommand: npm run start -w @cercago/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://salinas199621-del.github.io
      - key: GOOGLE_WEB_CLIENT_ID
        sync: false
