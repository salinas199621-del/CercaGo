services:
  - type: web
    name: cercago-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build:api && node -e "require('node:fs').accessSync('apps/api/dist/server.js')"
    startCommand: node --use-system-ca apps/api/dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://salinas199621-del.github.io
