services:
  - type: web
    name: cercago-api
    runtime: node
    plan: free
    autoDeployTrigger: commit
    buildCommand: npm ci --include=dev && npm run build:api && npm run build:website && VITE_BASE_PATH=/admin/ VITE_API_URL=https://cercago.onrender.com/api npm run build -w @cercago/admin && mkdir -p apps/api/public/download apps/api/public/admin && cp -R apps/website/dist/. apps/api/public/ && cp -R apps/admin/dist/. apps/api/public/admin/ && cp apps/mobile/download.html apps/api/public/download/index.html && node -e "require('node:fs').accessSync('apps/api/dist/server.js'); require('node:fs').accessSync('apps/api/public/index.html'); require('node:fs').accessSync('apps/api/public/admin/index.html')"
    startCommand: node --use-system-ca apps/api/dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://cercago.onrender.com,https://salinas199621-del.github.io
      - key: CERCAGO_API_URL
        value: https://cercago.onrender.com/api
